<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Monitor Spinner</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Main App Container -->
  <div class="app-container">
    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-button active" data-tab="spinner">🎡 Spinner</button>
      <button class="tab-button" data-tab="admin">⚙️ Admin Panel</button>
      <button class="tab-button" data-tab="history">📊 History</button>
    </nav>

    <!-- Spinner Tab -->
    <div id="spinner" class="tab-content active">
      <div class="container">
        <h1>🎡 Class Monitor Spinner</h1>
        <p class="subtitle">Spin the wheel to select the class monitor!</p>

        <div class="wheel-container">
          <div class="pointer"></div>
          <canvas id="wheel" width="700" height="700"></canvas>
        </div>

        <button id="spinButton" class="spin-btn">🎯 SPIN</button>

        <div id="result" class="result"></div>
      </div>
    </div>

    <!-- Admin Panel Tab -->
    <div id="admin" class="tab-content">
      <div class="container admin-container">
        <h1>⚙️ Admin Panel</h1>
        
        <div class="admin-section">
          <h2>Student Roster</h2>
          
          <div class="roster-actions">
            <input 
              type="text" 
              id="newStudentInput" 
              placeholder="Enter student name..." 
              class="input-field"
            >
            <button id="addStudentBtn" class="btn-primary">+ Add Student</button>
          </div>

          <div id="rosterList" class="roster-list">
            <!-- Populated dynamically -->
          </div>
        </div>

        <div class="admin-section">
          <h2>Roster Management</h2>
          
          <div class="import-export">
            <button id="exportBtn" class="btn-secondary">📥 Export Roster (CSV)</button>
            <button id="importBtn" class="btn-secondary">📤 Import Roster (CSV)</button>
            <input type="file" id="fileInput" accept=".csv" hidden>
            <button id="clearRosterBtn" class="btn-danger">🗑️ Clear All</button>
          </div>
        </div>

        <div class="admin-section">
          <h2>Default Roster</h2>
          <p class="info-text">Click to restore the original class roster</p>
          <button id="restoreDefaultBtn" class="btn-secondary">Restore Default Roster</button>
        </div>
      </div>
    </div>

    <!-- History Tab -->
    <div id="history" class="tab-content">
      <div class="container history-container">
        <h1>📊 Winner History</h1>
        
        <div class="history-stats">
          <div class="stat-card">
            <div class="stat-value" id="totalSpins">0</div>
            <div class="stat-label">Total Spins</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="uniqueWinners">0</div>
            <div class="stat-label">Unique Winners</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="mostWins">—</div>
            <div class="stat-label">Most Wins</div>
          </div>
        </div>

        <div class="history-controls">
          <button id="clearHistoryBtn" class="btn-secondary">Clear History</button>
        </div>

        <div id="historyList" class="history-list">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
